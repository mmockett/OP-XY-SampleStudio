name: Checks
# Checks the extension against the Open-XY SDK with the sample_studio capability: the SDK's
# extension checks, the studio's own tests, and a firmware compile with the pinned Blackfin
# tools beside the SDK's probe sample engine. No stock files or device.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  # The SDK with the sample_studio capability, until it is part of etcetc000/open-xy staging.
  OPEN_XY_REPOSITORY: mmockett/open-xy
  OPEN_XY_REF: sdk/sample-studio-capability
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: studio
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.OPEN_XY_REPOSITORY }}
          ref: ${{ env.OPEN_XY_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Host test tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          python -m pip install numpy==2.3.5
      - name: Extension checks
        run: python open-xy/sdk.py test --extension studio/sample_studio --cxx clang++ --host-cxx g++
      - name: Sample Studio's tests
        working-directory: studio/tests
        env:
          OPEN_XY: ${{ github.workspace }}/open-xy
        run: python -m unittest test_sample_studio
  firmware:
    # The pinned Blackfin tools run on Windows x86_64 and macOS arm64.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: studio
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.OPEN_XY_REPOSITORY }}
          ref: ${{ env.OPEN_XY_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned Blackfin tools
        run: python open-xy/sdk.py toolchain fetch
      - name: Firmware compile with Sample Studio
        shell: bash
        run: |
          # A build needs a machine; the SDK's probe sample engine stands in (the studio needs a sample engine).
          python open-xy/sdk.py compile --machine open-xy/tests/fixtures/machines/probesample \
            --extension studio/sample_studio --out "$RUNNER_TEMP/module"
